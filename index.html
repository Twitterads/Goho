  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Red Play Button Overlay */
    .play-btn {
      position: absolute;
      z-index: 5;
      width: 70px;
      height: 70px;
      background: rgba(229, 9, 20, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #fff;
      margin-left: 5px;
    }

    /* Outer Buffering Ring (Play Button ke Bahar Surround Hoga) */
    .spinner {
      position: absolute;
      z-index: 6;
      width: 92px;
      height: 92px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="video-container" id="mainContainer" onclick="openLink()">
    <!-- Red Play Button -->
    <div class="play-btn"></div>
    
    <!-- Outer Loading Ring -->
    <div class="spinner" id="loader"></div>
